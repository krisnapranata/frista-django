<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Verifikasi Wajah</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0f1720; --panel: #17212c; --text: #eef3f7; --muted: #9fb0bf;
    --ok: #2fbf71; --warn: #f2b33d; --err: #ef5a5a; --accent: #3aa0ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; gap: 16px; -webkit-user-select: none; user-select: none; }
  h1 { font-size: clamp(20px, 3.4vw, 30px); margin: 0; text-align: center; }
  .sub { color: var(--muted); font-size: clamp(14px, 2.2vw, 18px); text-align: center; margin: 0; }
  .stage { position: relative; width: min(92vw, 560px); aspect-ratio: 3 / 4;
    border-radius: 24px; overflow: hidden; background: #000; }
  @media (orientation: landscape) { .stage { width: min(60vh, 520px); } }
  video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* Kamera depan ditampilkan seperti cermin; kamera belakang apa adanya */
  video.mirror, canvas.mirror { transform: scaleX(-1); }
  video { background: #000; }
  /* Gambar terakhir kamera lama, ditahan selama kamera berganti */
  #freeze.blur { filter: blur(6px) brightness(.7); }
  .guide { position: absolute; inset: 12% 16%; border: 4px dashed rgba(255,255,255,.55);
    border-radius: 50%; transition: border-color .2s; pointer-events: none; }
  .guide.ready { border-style: solid; border-color: var(--ok); }
  .status { width: min(92vw, 560px); background: var(--panel); border-radius: 16px;
    padding: 16px 20px; font-size: clamp(16px, 2.6vw, 22px); text-align: center; min-height: 64px;
    display: flex; align-items: center; justify-content: center; gap: 10px; }
  .status.ok { background: color-mix(in srgb, var(--ok) 22%, var(--panel)); }
  .status.warn { background: color-mix(in srgb, var(--warn) 22%, var(--panel)); }
  .status.err { background: color-mix(in srgb, var(--err) 22%, var(--panel)); }
  .spinner { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,.25);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .attempts { color: var(--muted); font-size: 14px; }
  button { font: inherit; font-size: 18px; padding: 12px 28px; border: 0; border-radius: 12px;
    background: var(--accent); color: #fff; }
  button.secondary { background: var(--panel); border: 1px solid rgba(255,255,255,.25); }
  button:disabled { opacity: .5; }
  /* Tombol utama mode manual: besar, mudah ditekan petugas di tablet */
  button.capture { font-size: 22px; font-weight: 600; padding: 18px 44px; border-radius: 999px;
    background: var(--ok); min-width: min(80vw, 320px); }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .hidden { display: none !important; }
</style>
</head>
<body>
{% if error %}
  <h1>Verifikasi tidak dapat dilanjutkan</h1>
  <div class="status err">{{ error }}</div>
  <script>
    (function () {
      var r = { status: "SESSION_INVALID", message: "{{ error|escapejs }}", final: true };
      try { if (window.AndroidFrista && window.AndroidFrista.onResult) window.AndroidFrista.onResult(JSON.stringify(r)); } catch (e) {}
      try { if (window.parent !== window) window.parent.postMessage({ source: "frista", result: r }, "*"); } catch (e) {}
    })();
  </script>
{% else %}
  <h1>Verifikasi Wajah Peserta JKN</h1>
  <p class="sub" id="sub">Peserta: {{ member_id_masked }} &middot; Lepas masker/kacamata gelap, posisikan wajah di dalam lingkaran</p>

  <div class="stage" id="stage">
    <!-- poster transparan: tanpa ini WebView Android menampilkan ikon putar/loading saat video belum punya gambar -->
    <video id="video" autoplay muted playsinline
           poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>
    <canvas id="freeze" class="hidden"></canvas>
    <div class="guide" id="guide"></div>
  </div>

  <div class="status" id="status"><span class="spinner"></span><span id="statusText">Menyiapkan kamera…</span></div>
  <div class="attempts" id="attempts"></div>
  <div class="actions">
    <button id="captureBtn" class="capture hidden" type="button" disabled>Ambil Gambar</button>
    <button id="switchBtn" class="secondary hidden" type="button">Ganti Kamera</button>
    <button id="retryBtn" class="hidden" type="button">Coba lagi</button>
  </div>

  {{ cfg|json_script:"frista-cfg" }}
  <script>window.FRISTA_TOKEN = "{{ token|escapejs }}";</script>
  <script src="{{ faceapi_script }}"></script>
  <script>
  (function () {
    "use strict";
    var CFG = JSON.parse(document.getElementById("frista-cfg").textContent);
    var TOKEN = window.FRISTA_TOKEN;
    var video = document.getElementById("video");
    var guide = document.getElementById("guide");
    var statusBox = document.getElementById("status");
    var statusText = document.getElementById("statusText");
    var attemptsEl = document.getElementById("attempts");
    var retryBtn = document.getElementById("retryBtn");
    var switchBtn = document.getElementById("switchBtn");
    var captureBtn = document.getElementById("captureBtn");
    var freeze = document.getElementById("freeze");

    var stream = null, running = false, busy = false, stable = 0, finished = false, switching = false;

    // Mode: "manual" (tombol Ambil Gambar, seperti FRISTA Windows) atau "auto".
    // ?mode= di URL mengalahkan pengaturan server (CAPTURE_MODE).
    var params = new URLSearchParams(location.search);
    var modeParam = params.get("mode");
    var MANUAL = (modeParam === "auto" || modeParam === "manual" ? modeParam : CFG.mode) !== "auto";

    // Kamera: "environment" (belakang) atau "user" (depan). ?cam= di URL mengalahkan
    // pengaturan server (CAPTURE_CAMERA). Tidak mengingat pilihan sebelumnya, supaya
    // setiap sesi APM selalu dimulai dengan kamera yang sama.
    var camParam = params.get("cam");
    var facing = (camParam === "user" || camParam === "environment") ? camParam
               : (CFG.camera === "user" ? "user" : "environment");
    var deviceId = null;

    if (MANUAL) {
      document.getElementById("sub").innerHTML =
        "Peserta: {{ member_id_masked|escapejs }} &middot; Arahkan kamera ke wajah peserta, lalu tekan <b>Ambil Gambar</b>";
    }

    function setStatus(text, kind, spin) {
      statusText.textContent = text;
      statusBox.className = "status" + (kind ? " " + kind : "");
      var sp = statusBox.querySelector(".spinner");
      if (spin && !sp) { sp = document.createElement("span"); sp.className = "spinner"; statusBox.prepend(sp); }
      if (!spin && sp) sp.remove();
    }

    // Kirim hasil ke aplikasi APM (Android WebView bridge / iframe parent)
    function notify(result) {
      try { if (window.AndroidFrista && window.AndroidFrista.onResult) window.AndroidFrista.onResult(JSON.stringify(result)); } catch (e) {}
      try { if (window.parent !== window) window.parent.postMessage({ source: "frista", result: result }, "*"); } catch (e) {}
    }

    function stopStream() {
      if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    }

    function stopCamera() {
      running = false;
      stopStream();
      switchBtn.classList.add("hidden");
      captureBtn.classList.add("hidden");
    }

    function videoConstraints(id) {
      var v = { width: { ideal: 640 }, height: { ideal: 480 } };
      // "ideal" supaya perangkat yang hanya punya satu kamera tetap bisa dipakai
      if (id) v.deviceId = { exact: id }; else v.facingMode = { ideal: facing };
      return { video: v, audio: false };
    }

    async function getStream(id) {
      try {
        return await navigator.mediaDevices.getUserMedia(videoConstraints(id));
      } catch (e) {
        if (!id) throw e;
        // Kamera yang dipilih sudah tidak ada (mis. dicabut): pakai facingMode
        return await navigator.mediaDevices.getUserMedia(videoConstraints(null));
      }
    }

    function trackSettings() {
      var t = stream && stream.getVideoTracks()[0];
      return t && t.getSettings ? t.getSettings() : {};
    }

    // Sebagian tablet/kamera USB tidak melaporkan facingMode, sehingga facingMode
    // "environment" bisa membuka kamera depan. Cari kamera yang diminta lewat namanya.
    var LABEL = { environment: /back|rear|belakang|environment|world/i, user: /front|depan|user|facetime|selfie/i };
    async function findByLabel(want) {
      var hit = (await listCameras()).find(function (c) { return LABEL[want].test(c.label || ""); });
      return hit ? hit.deviceId : null;
    }

    async function openCamera(id) {
      var want = facing;
      stopStream();
      stream = await getStream(id);
      var settings = trackSettings();
      if (!id && settings.facingMode !== want) {
        var match = await findByLabel(want);
        if (match && match !== settings.deviceId) {
          stopStream();
          stream = await getStream(match);
          settings = trackSettings();
          if (!settings.facingMode) settings.facingMode = want;   // dipilih lewat nama kamera
        }
      }
      if (settings.facingMode === "user" || settings.facingMode === "environment") facing = settings.facingMode;
      deviceId = settings.deviceId || id || null;
      video.classList.toggle("mirror", facing !== "environment");
      video.srcObject = stream;
      await new Promise(function (res) { video.onloadedmetadata = res; });
      await video.play();
      await firstFrame();
    }

    // Tunggu sampai kamera benar-benar mengirim gambar, bukan sekadar metadata
    function firstFrame() {
      return new Promise(function (res) {
        var done = false, t = setTimeout(finishWait, 1500);
        function finishWait() { if (!done) { done = true; clearTimeout(t); res(); } }
        if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(finishWait);
        else video.addEventListener("timeupdate", finishWait, { once: true });
      });
    }

    // Bekukan gambar terakhir: buram selama kamera berganti, tajam sebagai foto yang diambil
    function holdFrame(blur) {
      if (!video.videoWidth) return false;
      freeze.width = video.videoWidth; freeze.height = video.videoHeight;
      freeze.getContext("2d").drawImage(video, 0, 0);
      freeze.classList.toggle("mirror", video.classList.contains("mirror"));
      freeze.classList.toggle("blur", !!blur);
      freeze.classList.remove("hidden");
      return true;
    }
    function releaseFrame() { freeze.classList.add("hidden"); }

    async function listCameras() {
      try {
        var devices = await navigator.mediaDevices.enumerateDevices();
        return devices.filter(function (d) { return d.kind === "videoinput" && d.deviceId; });
      } catch (e) { return []; }
    }

    async function showSwitchIfAvailable() {
      if ((await listCameras()).length > 1 && !finished) switchBtn.classList.remove("hidden");
    }

    async function switchCamera() {
      if (switching || busy || finished) return;
      switching = true; switchBtn.disabled = true; captureBtn.disabled = true; stable = 0;
      guide.classList.remove("ready");
      var prevId = deviceId, prevFacing = facing;
      var cams = await listCameras();
      var idx = cams.findIndex(function (c) { return c.deviceId === deviceId; });
      var next = cams[(idx + 1) % cams.length];
      facing = facing === "user" ? "environment" : "user";   // dikoreksi oleh getSettings bila tersedia
      holdFrame(true);
      try {
        setStatus("Mengganti kamera…", "", true);
        await openCamera(next ? next.deviceId : null);
        lastHint = "";
        readyStatus();
      } catch (e) {
        // Kembali ke kamera sebelumnya kalau kamera yang dipilih gagal dibuka
        facing = prevFacing;
        try { await openCamera(prevId); } catch (e2) {}
        setStatus("Kamera lain tidak dapat dibuka", "warn", false);
      }
      releaseFrame();
      switching = false; switchBtn.disabled = false; captureBtn.disabled = false;
    }

    function readyStatus() {
      if (MANUAL) setStatus("Arahkan kamera ke wajah peserta, lalu tekan Ambil Gambar", "", false);
      else setStatus("Lihat ke kamera dan diam sejenak…", "", true);
    }

    function finish(result, text, kind) {
      finished = true;
      stopCamera();
      setStatus(text, kind, false);
      notify(result);
    }

    async function init() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        finish({ status: "CAMERA_UNAVAILABLE", message: "Kamera tidak tersedia (halaman harus dibuka lewat HTTPS)", final: true },
               "Kamera tidak tersedia. Halaman harus dibuka lewat HTTPS.", "err");
        return;
      }
      try {
        // Kamera dulu, baru model: di tablet yang lemah, memuat model bersamaan dengan
        // membuka kamera membuat pratinjau hitam sampai model selesai dimuat.
        setStatus("Membuka kamera…", "", true);
        await openCamera(null);
      } catch (e) {
        finish({ status: "CAMERA_ERROR", message: String(e && e.message || e), final: true },
               "Gagal membuka kamera: " + (e && e.message || e), "err");
        return;
      }
      showSwitchIfAvailable();
      try {
        setStatus("Memuat model pengenalan wajah…", "", true);
        await loadModels();
        setStatus("Menyiapkan pembaca wajah…", "", true);
        await warmUp();
        if (MANUAL) { captureBtn.classList.remove("hidden"); captureBtn.disabled = false; readyStatus(); }
        else startLoop();
      } catch (e) {
        finish({ status: "MODEL_ERROR", message: "Gagal memuat model wajah: " + (e && e.message || e), final: true },
               "Gagal memuat model wajah. Periksa koneksi ke server.", "err");
      }
    }

    // ---------- model face-api ----------
    // Detektor "tiny" (190 KB) jauh lebih ringan daripada "ssd" (5,6 MB). Encoding wajah
    // tetap dihitung oleh model landmark + recognition yang sama, hanya cara mencari
    // letak wajahnya yang berbeda.
    var TINY = CFG.detector !== "ssd";
    var DETECTOR = TINY
      ? { net: faceapi.nets.tinyFaceDetector, file: "tiny_face_detector_model" }
      : { net: faceapi.nets.ssdMobilenetv1, file: "ssd_mobilenetv1_model" };
    // Skor detektor tiny umumnya lebih rendah daripada ssd untuk wajah yang sama
    var MIN_SCORE = TINY ? Math.min(CFG.minScore, 0.6) : CFG.minScore;

    function detectorOptions() {
      return TINY ? new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.5 })
                  : new faceapi.SsdMobilenetv1Options({ minConfidence: 0.6 });
    }

    // Model diunduh sendiri (bukan loadFromUri) supaya kemajuan unduhan bisa ditampilkan,
    // lalu disimpan permanen di Cache Storage tablet: hanya diunduh sekali, tidak
    // bergantung pada cache HTTP WebView yang bisa dibersihkan aplikasi/sistem.
    // Naikkan versi nama cache bila file model diganti.
    var MODEL_CACHE = "frista-faceapi-v1";
    var got = {}, expect = {}, manifestsLeft = 3;
    function showProgress() {
      var a = 0, b = 0, k;
      for (k in got) a += got[k];
      if (!manifestsLeft) for (k in expect) b += expect[k];   // total baru pasti setelah semua manifest terbaca
      var mb = function (n) { return (n / 1048576).toFixed(1).replace(".", ","); };
      setStatus("Memuat model pengenalan wajah… " + mb(Math.min(a, b || a)) + (b ? " / " + mb(b) : "") + " MB", "", true);
    }

    async function openModelCache() {
      try { return window.caches ? await caches.open(MODEL_CACHE) : null; } catch (e) { return null; }
    }

    // Ukuran asli (tidak terkompresi) bobot model dihitung dari manifest, karena dengan
    // gzip Content-Length adalah ukuran terkompresi dan tidak bisa dipakai untuk progres.
    function groupBytes(group) {
      return group.weights.reduce(function (sum, w) {
        var n = w.shape.reduce(function (a, d) { return a * d; }, 1);
        var q = w.quantization && w.quantization.dtype;
        return sum + n * (q === "uint8" ? 1 : q === "uint16" ? 2 : 4);
      }, 0);
    }

    async function getBytes(url, store, track) {
      if (store) {
        try {
          var hit = await store.match(url);
          if (hit) {
            var c = new Uint8Array(await hit.arrayBuffer());
            if (track) { got[url] = c.length; showProgress(); }
            return c;
          }
        } catch (e) {}
      }
      var res = await fetch(url);
      if (!res.ok) throw new Error("HTTP " + res.status + " " + url);
      var out;
      if (!res.body || !res.body.getReader) {
        out = new Uint8Array(await res.arrayBuffer());
        if (track) { got[url] = out.length; showProgress(); }
      } else {
        var reader = res.body.getReader(), chunks = [], n = 0;
        for (;;) {
          var r = await reader.read();
          if (r.done) break;
          chunks.push(r.value); n += r.value.length;
          if (track) { got[url] = n; showProgress(); }
        }
        out = new Uint8Array(n);
        var off = 0;
        chunks.forEach(function (ch) { out.set(ch, off); off += ch.length; });
      }
      if (store) { try { await store.put(url, new Response(out)); } catch (e) {} }
      return out;
    }

    async function loadNet(net, file, store) {
      var base = CFG.modelUrl.replace(/\/$/, "") + "/";
      var manifest = JSON.parse(new TextDecoder().decode(await getBytes(base + file + "-weights_manifest.json", store, false)));
      var map = {};
      manifest.forEach(function (group, i) { expect[file + i] = groupBytes(group); });
      manifestsLeft--;
      showProgress();
      await Promise.all(manifest.map(async function (group) {
        var parts = await Promise.all(group.paths.map(function (p) { return getBytes(base + p, store, true); }));
        var len = parts.reduce(function (a, p) { return a + p.length; }, 0);
        var buf = new Uint8Array(len), off = 0;
        parts.forEach(function (p) { buf.set(p, off); off += p.length; });
        Object.assign(map, faceapi.tf.io.decodeWeights(buf.buffer, group.weights));
      }));
      net.loadFromWeightMap(map);
    }

    async function loadModels() {
      var store = await openModelCache();
      return Promise.all([
        loadNet(DETECTOR.net, DETECTOR.file, store),
        loadNet(faceapi.nets.faceLandmark68Net, "face_landmark_68_model", store),
        loadNet(faceapi.nets.faceRecognitionNet, "face_recognition_model", store)
      ]);
    }

    // Pemakaian model yang pertama kali jauh lebih lambat (WebGL menyusun shader).
    // Jalankan sekali di gambar kosong supaya tombol Ambil Gambar langsung cepat.
    async function warmUp() {
      var c = document.createElement("canvas");
      c.width = c.height = 150;
      c.getContext("2d").fillRect(0, 0, 150, 150);
      try {
        await faceapi.detectSingleFace(c, detectorOptions());
        await faceapi.nets.faceLandmark68Net.detectLandmarks(c);
        await faceapi.nets.faceRecognitionNet.computeFaceDescriptor(c);
      } catch (e) {}
    }

    // ---------- mode manual: tombol Ambil Gambar ----------
    // Satu tekanan mengambil beberapa frame berturut-turut (burst), lalu memakai frame
    // yang paling tajam. Ini menolong pasien yang wajahnya sulit diam (gambar tidak blur).
    var BURST_FRAMES = 5, BURST_GAP_MS = 70, BURST_TRY = 2;

    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    function grabFrame() {
      var c = document.createElement("canvas");
      c.width = video.videoWidth; c.height = video.videoHeight;
      c.getContext("2d").drawImage(video, 0, 0);
      return c;
    }

    // Ketajaman = varian Laplacian di bagian tengah gambar (tempat wajah), diperkecil
    // ke 128 px supaya cepat. Gambar yang blur karena gerakan nilainya kecil.
    var sharpCanvas = document.createElement("canvas");
    function sharpness(c) {
      var n = 128, side = Math.min(c.width, c.height) * 0.6;
      sharpCanvas.width = sharpCanvas.height = n;
      var ctx = sharpCanvas.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(c, (c.width - side) / 2, (c.height - side) / 2, side, side, 0, 0, n, n);
      var d = ctx.getImageData(0, 0, n, n).data, g = new Float32Array(n * n), i, x, y;
      for (i = 0; i < n * n; i++) g[i] = d[i * 4] * 0.299 + d[i * 4 + 1] * 0.587 + d[i * 4 + 2] * 0.114;
      var sum = 0, sq = 0, cnt = 0;
      for (y = 1; y < n - 1; y++) for (x = 1; x < n - 1; x++) {
        i = y * n + x;
        var l = 4 * g[i] - g[i - 1] - g[i + 1] - g[i - n] - g[i + n];
        sum += l; sq += l * l; cnt++;
      }
      var mean = sum / cnt;
      return sq / cnt - mean * mean;
    }

    function showFrame(c) {
      freeze.width = c.width; freeze.height = c.height;
      freeze.getContext("2d").drawImage(c, 0, 0);
    }

    async function capture() {
      if (busy || switching || finished || !holdFrame(false)) return;
      busy = true; captureBtn.disabled = true; switchBtn.disabled = true;
      setStatus("Mengambil gambar…", "", true);

      var frames = [];
      for (var k = 0; k < BURST_FRAMES; k++) {
        if (k) await wait(BURST_GAP_MS);
        var c = grabFrame();
        frames.push({ canvas: c, sharp: sharpness(c) });
      }
      frames.sort(function (a, b) { return b.sharp - a.sharp; });

      setStatus("Memeriksa wajah…", "", true);
      var det = null, problem = "";
      for (var t = 0; t < Math.min(BURST_TRY, frames.length); t++) {
        var f = frames[t].canvas;
        try {
          det = await faceapi.detectSingleFace(f, detectorOptions()).withFaceLandmarks().withFaceDescriptor();
        } catch (e) { det = null; }
        problem = !det ? "Wajah tidak terdeteksi. Arahkan kamera ke wajah peserta lalu ambil ulang."
                       : faceProblem(det.detection, f.width, f.height);
        if (!problem) { showFrame(f); break; }
      }
      frames = null;
      if (problem) {
        busy = false;
        setStatus(problem, "warn", false);
        resumePreview();
        return;
      }
      guide.classList.add("ready");
      await send(det.descriptor);
    }

    // Kembali ke pratinjau kamera agar petugas bisa mengambil gambar lagi
    function resumePreview() {
      if (finished) return;
      releaseFrame();
      guide.classList.remove("ready");
      captureBtn.disabled = false; switchBtn.disabled = false;
    }

    // ---------- mode otomatis ----------
    function startLoop() {
      running = true; stable = 0;
      retryBtn.classList.add("hidden");
      readyStatus();
      loop();
    }

    async function loop() {
      if (!running || finished) return;
      if (!busy && !switching) {
        try {
          // Tiap frame hanya deteksi (ringan); landmark + descriptor (berat) dihitung
          // sekali saja setelah wajah stabil
          var det = await faceapi.detectSingleFace(video, detectorOptions());
          if (det && goodFrame(det)) {
            stable++;
            guide.classList.add("ready");
            if (stable >= CFG.stableFrames) {
              var full = await faceapi.detectSingleFace(video, detectorOptions()).withFaceLandmarks().withFaceDescriptor();
              if (full && !faceProblem(full.detection, video.videoWidth, video.videoHeight)) await send(full.descriptor);
              else stable = 0;
            }
          } else {
            stable = 0;
            guide.classList.remove("ready");
          }
        } catch (e) { stable = 0; }
      }
      if (running && !finished) setTimeout(loop, 250);
    }

    // Wajah cukup besar, cukup jelas, dan berada di tengah. Mengembalikan pesan bila tidak.
    // det = FaceDetection (punya box dan score)
    function faceProblem(det, vw, vh) {
      var box = det.box;
      if (det.score < MIN_SCORE) return "Wajah kurang jelas, pastikan cahaya cukup";
      if (box.width < vw * 0.22) return "Wajah terlalu kecil, dekatkan kamera ke wajah";
      var cx = (box.x + box.width / 2) / vw, cy = (box.y + box.height / 2) / vh;
      if (Math.abs(cx - 0.5) > 0.2 || Math.abs(cy - 0.5) > 0.22) return "Posisikan wajah di tengah lingkaran";
      return "";
    }
    function goodFrame(det) {
      var p = faceProblem(det, video.videoWidth, video.videoHeight);
      hint(p || "Tahan posisi…");
      return !p;
    }
    var lastHint = "";
    function hint(t) { if (t !== lastHint && !busy) { lastHint = t; setStatus(t, "", true); } }

    async function send(descriptor) {
      busy = true; running = false;
      setStatus("Memverifikasi data peserta…", "", true);
      var res, data;
      // Server membatasi verifikasi ~45 detik; beri sedikit kelonggaran sebelum menyerah
      var ctrl = window.AbortController ? new AbortController() : null;
      var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 70000) : null;
      try {
        res = await fetch(CFG.verifyUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ t: TOKEN, encoding: Array.from(descriptor) }),
          signal: ctrl ? ctrl.signal : undefined
        });
        try {
          data = await res.json();
        } catch (e) {
          // Bukan JSON: biasanya halaman error proxy (502/504) karena server terlalu lama
          data = { status: "NETWORK_ERROR", final: false,
                   message: "Server APM membalas HTTP " + res.status +
                            (res.status === 502 || res.status === 504 ? " (waktu tunggu habis)" : "") };
        }
      } catch (e) {
        data = { status: "NETWORK_ERROR", final: false,
                 message: e && e.name === "AbortError" ? "Server APM terlalu lama menjawab"
                                                       : "Tidak dapat terhubung ke server APM" };
      }
      if (timer) clearTimeout(timer);
      busy = false;
      if (data.attempt) attemptsEl.textContent = "Percobaan " + data.attempt + " dari " + data.max_attempts;
      handle(data);
    }

    function handle(r) {
      switch (r.status) {
        case "OK":
          finish(r, "Verifikasi berhasil" + (r.data && r.data.nama ? ": " + r.data.nama : ""), "ok"); break;
        case "ALREADY_REGISTERED":
          finish(r, "Peserta sudah terverifikasi hari ini", "ok"); break;
        case "UNREGISTERED":
          finish(r, "Wajah Anda belum terdaftar. Silakan ke loket petugas.", "warn"); break;
        case "FACE_MISMATCH":
        case "FACE_UNPROCESSABLE":
        case "DUPLICATE_PHOTO":
        case "SERVER_UNREACHABLE":
        case "NETWORK_ERROR":
          if (r.final) { finish(r, "Verifikasi gagal. Silakan ke loket petugas.", "err"); }
          else if (MANUAL) {
            setStatus((r.message || "Wajah tidak cocok") + ". Tekan Ambil Ulang.", "warn", false);
            resumePreview();
            captureBtn.textContent = "Ambil Ulang";
          }
          else { setStatus(r.message || "Wajah tidak cocok, coba lagi", "warn", false); retryBtn.classList.remove("hidden"); setTimeout(function () { if (!finished && !running) startLoop(); }, 2500); }
          break;
        default:
          finish(r, (r.message || "Terjadi kesalahan") + ". Silakan ke loket petugas.", "err");
      }
    }

    retryBtn.addEventListener("click", function () { if (!finished && !running) startLoop(); });
    switchBtn.addEventListener("click", switchCamera);
    captureBtn.addEventListener("click", capture);
    window.addEventListener("pagehide", stopCamera);

    {% if already_done %}
      finish({ status: "ALREADY_REGISTERED", message: "Sesi ini sudah terverifikasi", final: true }, "Sesi ini sudah terverifikasi", "ok");
    {% else %}
      init();
    {% endif %}
  })();
  </script>
{% endif %}
</body>
